<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
    <meta name="theme-color" content="#f3f1ec" data-light="#f3f1ec" data-dark="#131b18"/>
    <meta name="description" content="A little less admin. A little more teaching. Your classes, attendance, fees and tutes in one place."/>
    <style>@media screen { html[data-theme="dark"] { background: #131b18; color-scheme: dark; } }</style>
    <script>
      // Restore the device's choice before the first paint, including offline launches.
      try {
        if (localStorage.getItem("classroom-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          const bar = document.querySelector('meta[name="theme-color"]');
          bar.content = bar.dataset.dark;
        }
      } catch {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
    <title>Classroom · Attendance &amp; fees</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
